name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a fast follow-up push doesn't
# wait behind a stale one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api / lint, typecheck, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict)
        run: mypy --strict src

      - name: Test (pytest)
        run: pytest -v

      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit

  web:
    name: web / lint, typecheck, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high

  mcp_server:
    name: mcp_server / lint, typecheck, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp_server/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict)
        run: mypy --strict src

      - name: Test (pytest)
        run: pytest -v

      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit

  terraform:
    name: terraform / fmt, validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      # No GCP credentials needed for validate — it only checks the config
      # against the provider schema, never touches real infrastructure.
      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  terraform-plan:
    name: terraform / plan (needs GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT repo secrets)
    runs-on: ubuntu-latest
    # push-to-main only, not every PR — plan needs real GCP credentials via
    # WIF, which aren't (and shouldn't be) available to arbitrary PR runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - id: check
        run: |
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP_WORKLOAD_IDENTITY_PROVIDER/GCP_SERVICE_ACCOUNT repo secrets are not set — terraform plan skipped, not failed. See infra/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.configured == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.configured == 'true'
        with:
          terraform_version: "1.9.8"

      - run: terraform init
        if: steps.check.outputs.configured == 'true'

      # Fails the build only on a plan *error* (broken config, an invalid
      # reference, a value the provider rejects) — not on "changes
      # pending," which is the expected state until deploy.yml's own apply
      # step has actually run at least once for a brand-new environment.
      # Once staging is live and stable, a clean (zero-diff) plan becomes
      # the meaningful signal; see infra/README.md for that maturity note.
      - name: Plan (staging) — fails only on a real error, not a pending diff
        if: steps.check.outputs.configured == 'true'
        run: terraform plan -var-file=staging.tfvars -detailed-exitcode || [ $? -eq 2 ]
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_jwt_secret_key: ${{ secrets.TF_VAR_JWT_SECRET_KEY }}
          TF_VAR_internal_service_key: ${{ secrets.TF_VAR_INTERNAL_SERVICE_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_GEMINI_API_KEY }}

  agents:
    name: agents / lint, typecheck, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agents/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict)
        run: mypy --strict orchestrator breakdown_agent frame_agent app_build_agent critic_agent iteration_agent shared

      - name: Test (pytest)
        run: pytest -v

      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit
