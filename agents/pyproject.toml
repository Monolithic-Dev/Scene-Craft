[project]
name = "scenecraft-agents"
version = "0.1.0"
description = "SceneCraft's agent orchestrator and per-agent implementations"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=0.3.0",
    "mcp>=1.2.0,<2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# frame_agent was missing here even though Phase 3 shipped it — editable
# installs (pip install -e .) don't enforce this filter, so it worked
# locally by accident; a real non-editable build (the Cloud Run Docker
# image) would have silently shipped without it. Caught while adding
# Phase 4's packages.
include = [
    "orchestrator*",
    "breakdown_agent*",
    "frame_agent*",
    "app_build_agent*",
    "critic_agent*",
    "iteration_agent*",
    "shared*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
