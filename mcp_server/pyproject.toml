[project]
name = "scenecraft-mcp-server"
version = "0.1.0"
description = "SceneCraft's internal MCP server - project-state tools for agents"
requires-python = ">=3.12"
dependencies = [
    # Pinned below 2.x: mcp 2.0 renamed FastMCP -> MCPServer and changed the
    # tool-registration API. Revisit the pin once the ecosystem (docs,
    # examples, this codebase) has caught up to the v2 migration guide.
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
scenecraft-mcp-server = "src.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
